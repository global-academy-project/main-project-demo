apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
spec:
  serviceName: qdrant-headless
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.20
        ports:
        - name: http
          containerPort: 6333
        env:
        - name: QDRANT__SERVICE__API_KEY
          valueFrom:
            secretKeyRef:
              name: common-qdrant-secret
              key: QDRANT__SERVICE__API_KEY
        - name: QDRANT__SERVICE__READ_ONLY_API_KEY
          valueFrom:
            secretKeyRef:
              name: common-qdrant-secret
              key: QDRANT__SERVICE__READ_ONLY_API_KEY
        - name: DEBUG
          value: "True"
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
        volumeMounts:
        - name: qdrant-data
          mountPath: /qdrant/storage
      volumes:
      - name: qdrant-data
        persistentVolumeClaim:
          claimName: qdrant-data-volume