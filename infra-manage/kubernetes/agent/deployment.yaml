apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-model
  template:
    metadata:
      labels:
        app: ai-model
    spec:
      securityContext:
        fsGroup: 65003
      containers:
      - name: ai-model
        image: ai-model:20261125100632942
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 60100
          name: http
        envFrom:
        - configMapRef:
            name: common-python-config
        - configMapRef:
            name: common-embedding-config
        - secretRef:
            name: common-embedding-secret
        - secretRef:
            name: common-kosha-secret
        env:
        - name: INTERNAL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: common-spring-secret
              key: INTERNAL_API_TOKEN
        - name: QDRANT_READ_ONLY_API_KEY
          valueFrom:
            secretKeyRef:
              name: common-qdrant-secret
              key: QDRANT__SERVICE__READ_ONLY_API_KEY
        - name: NETWORK_ENV
          value: OPEN
        - name: CHECK_RULES_TOOL
          value: MOCK
        - name: RAG_BACKEND
          value: app.rag.tool_backend:build_search_backend
        - name: RAG_SEARCH_TIMEOUT_SECONDS
          value: "60"
        - name: INTERNAL_API_BASE_URL
          value: http://spring-service:60001
        - name: EMBEDDING_URL
          value: http://embedding-service:60110/v1/embeddings
        - name: QDRANT_URL
          value: http://qdrant-service:6333
        - name: HF_HOME
          value: /models/huggingface
        - name: LLM_ADAPTERS
          value: '{"extract":"/models/adapters/extract","work_register":"/models/adapters/work_register"}'
        - name: VISION_MODEL_PATH
          value: /models/yolox/yolox_nano.onnx
        - name: VISION_HELMET_MODEL_PATH
          value: /models/yolox/helmet_nano.onnx
        - name: STT_MODEL_PATH
          value: /models/huggingface/whisper-small-ko
        - name: STT_MODEL_NAME
          value: whisper-small-ko
        - name: MSDS_TOOL
          value: KOSHA
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        volumeMounts:
        - name: model-cache
          mountPath: /models/huggingface
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-data-volume
