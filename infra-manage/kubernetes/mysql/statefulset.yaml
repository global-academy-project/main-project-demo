apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: "mysql-service"
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      restartPolicy: Always
      containers:
      - name: mysql-client-container
        image: mysql:8.4.13-oraclelinux9
        ports:
        - containerPort: 3306
        envFrom:
          - configMapRef:
              name: common-system-config
          - configMapRef:
              name: common-mysql-config
          - secretRef:
              name: common-mysql-secret
          - secretRef:
              name: common-kb-secret
          - secretRef:
              name: common-flyway-secret
        args:
          - mysqld
          - --log-bin-trust-function-creators=1
          - --default-time-zone=+09:00
          - --character-set-server=utf8mb4
          - --collation-server=utf8mb4_unicode_ci
        volumeMounts:
        - name: mysql-data-volume
          mountPath: /var/lib/mysql
        - name: mysql-init-scripts
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: mysql-verify-files
          mountPath: /opt/verify
          readOnly: true
        - name: report-dummy-data
          mountPath: /tmp/report-dummy-data
          readOnly: true
      volumes:
      - name: mysql-data-volume
        persistentVolumeClaim:
          claimName: mysql-data-volume
      - name: mysql-init-scripts
        configMap:
          name: mysql-init-scripts
      - name: mysql-verify-files
        configMap:
          name: mysql-verify-files
      - name: report-dummy-data
        configMap:
          name: report-dummy-data